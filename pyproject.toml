[project]
name = "k8s-spot-termination-notice"
version = "3.1"
description = "Kubernetes Spot Instance Notification"
requires-python = ">=3.13"
dependencies = [
  "requests>=2.34.2",
  "slack-sdk>=3.47.0",
  "kubernetes>=37.0.3",
]

[dependency-groups]
dev = [
  "flake8>=7.5.0",
  "coverage>=7.17.3",
  "pytest>=9.2.0",
]
docs = [
  "mkdocs~=1.6",
  "mkdocs-material~=9.8",
  "pygments~=2.21",
  "pymdown-extensions>=13.1,<14.0",
]

[tool.uv]
package = false

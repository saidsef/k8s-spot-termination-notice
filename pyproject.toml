[project]
name = "k8s-spot-termination-notice"
version = "3.1"
description = "Kubernetes Spot Instance Notification"
requires-python = ">=3.13"
dependencies = [
  "requests>=2.32.0",
  "slack-sdk>=3.43.0",
  "kubernetes>=37.0.1",
]

[dependency-groups]
dev = [
  "flake8>=7.0.0",
  "coverage>=7.15.4",
  "pytest>=9.1.1",
]
docs = [
  "mkdocs~=1.6",
  "mkdocs-material~=9.5",
  "pygments~=2.18",
  "pymdown-extensions~=12.3",
]

[tool.uv]
package = false

site_name: k8s-spot-termination-notice
repo_url: https://github.com/saidsef/k8s-spot-termination-notice
strict: true
validation:
  links:
    anchors: warn
theme:
  name: material
  palette:
    primary: teal
  features:
  - content.code.copy
  - content.tabs.link
markdown_extensions:
- codehilite
- admonition
- tables
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: README.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Deployment:
    - Deploying on Kubernetes: deploying.md
    - Node draining: draining.md
    - Operations: operations.md
  - CI and releases: ci.md

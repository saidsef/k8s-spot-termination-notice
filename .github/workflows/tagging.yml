name: Tagging
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  COMMIT_MSG: ${{ github.event.head_commit.message }}

jobs:
  tagging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Fetch remote tags
        run: git fetch --all
      - name: Set Tag Value
        run: |
          echo "DATE=v$(echo `date +'%Y.%m'`)" >> $GITHUB_ENV
          echo "CHANGELOG=`git log --oneline $(git describe --tags @ --abbrev=0 @^ | head -n 1)..@ --pretty=format:"%h %an %s"`" >> $GITHUB_ENV
      - name: Create Tag
        uses: actions/github-script@v9
        if: ${{ env.DATE }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            let tagExists = [];
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "refs/tags/${{ env.DATE }}",
                message: "${{ env.CHANGELOG }}",
                sha: sha
              });
            } catch (e) {
              console.log("Tag already exists: " + e)
              tagExists.push(e);
            }

            if (tagExists.length > 0) {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/${{ env.DATE }}",
                message: "${{ env.CHANGELOG }}",
                sha: sha
              });
            }

---
name: CI
on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "deployment/**"
      - "groovy/**"
      - "files/**"
      - "test/**"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "*.py"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "deployment/**"
      - "groovy/**"
      - "files/**"
      - "test/**"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "*.py"

env:
  REGISTRY: docker.io
  OWNER: ${{ github.repository_owner }}

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]
    name: Python ${{ matrix.python-version }} version
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7
    - name: Set up UV and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Test application
      run: |
        uv sync --frozen --group dev
        uv run flake8 . --count --show-source --statistics --ignore=E111,E501 --exit-zero --output-file=flake8tmp.txt
        uv run coverage run -m pytest . && uv run coverage report && uv run coverage xml -o coverage.xml
    - name: Codecov Test Upload
      continue-on-error: true
      uses: codecov/codecov-action@v7

  build:
    runs-on: ubuntu-latest
    needs: [python-test]
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7
    - name: Set Tag Names
      run: |
        echo "TAG=$(echo ${GITHUB_REF##*/})" >> $GITHUB_ENV
        echo "DATE=v$(echo `date +'%Y.%m'`)" >> $GITHUB_ENV
        echo "REPO_NAME=$(echo ${PWD##*/})" >> $GITHUB_ENV
    - name: Login to DockerHub
      uses: docker/login-action@v4
      if: success()
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
      env:
        DOCKER_BUILDKIT: 1

    - name: Build and push Docker image - (MAIN)
      uses: docker/build-push-action@v7
      if: success()
      env:
        DOCKER_BUILDKIT: 1
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILD_ID=${{ env.DATE }}
        pull: true
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO_NAME }}:${{ env.TAG == 'main' && 'latest' || env.TAG }}

    - name: Build and push Docker image - (DATE)
      uses: docker/build-push-action@v7
      if: ${{ github.event_name == 'schedule' || contains(github.ref, 'main') }}
      env:
        DOCKER_BUILDKIT: 1
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        build-args: |
          BUILD_ID=${{ env.DATE }}
        pull: true
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO_NAME }}:${{ env.DATE }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      if: success()
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO_NAME }}:${{ env.TAG == 'main' && 'latest' || env.TAG }}
        format: 'template'
        template: '@/contrib/sarif.tpl'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: success()
      with:
        sarif_file: 'trivy-results.sarif'

  k8s-test:
    runs-on: ubuntu-latest
    needs: [python-test]
    if: ${{ ! contains(github.ref, 'main') && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v1.36.4
            digest: sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - version: v1.37.0
            digest: sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    name: Kubernetes ${{ matrix.version }}
    steps:
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind
          kubectl_version: v1.37.1
          node_image: kindest/node:${{ matrix.version }}@${{ matrix.digest }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and load image
        run: |
          docker build -t docker.io/saidsef/k8s-spot-termination-notice:ci .
          kind load docker-image docker.io/saidsef/k8s-spot-termination-notice:ci --name kind
      - name: Run K8s test
        run: |
          kubectl cluster-info
          export NS=`cat deployment/kustomization.yml | grep '^namespace:' | awk '{ print $2 }'`
          if [ -z "$NS" ]; then
            export NS='default'
          fi
          kubectl get namespace $NS >/dev/null 2>&1 || kubectl create namespace $NS
          (cd deployment && kustomize edit set namespace $NS)
          (cd deployment && kustomize edit set image docker.io/saidsef/k8s-spot-termination-notice:ci)
          (cd deployment && kustomize edit add patch --kind DaemonSet --name spot-termination-notice --patch '[{"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy", "value": "Never"}]')
          kubectl apply -k deployment/
          kubectl -n $NS rollout status ds/spot-termination-notice --timeout=180s
          timeout 180 sh -c "until kubectl -n $NS logs ds/spot-termination-notice 2>/dev/null | grep -q 'watcher started'; do sleep 5; done" || {
            kubectl -n $NS describe pods -l app.kubernetes.io/name=spot-termination-notice
            kubectl -n $NS logs ds/spot-termination-notice
            exit 1
          }
          kubectl get all,crd,sa,roles,clusterroles,clusterrolebindings -A -l app.kubernetes.io/name=spot-termination-notice

  auto-approve:
    runs-on: ubuntu-latest
    needs: [build, k8s-test]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Auto Approve PR
      uses: actions/github-script@v9
      with:
       script: |
        github.rest.pulls.createReview({
          owner: context.repo.owner,
          repo: context.repo.repo,
          pull_number: context.issue.number,
          event: "APPROVE"
        })

  auto-preview:
    runs-on: ubuntu-latest
    needs: [auto-approve]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Add Preview Label
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['preview']
          })
